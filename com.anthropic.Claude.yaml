app-id: com.anthropic.Claude
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk

base: org.electronjs.Electron2.BaseApp
base-version: '25.08'

command: claude-desktop
separate-locales: false

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --device=kvm
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=com.canonical.AppMenu.Registrar
  - --talk-name=org.freedesktop.secrets
  - --system-talk-name=org.freedesktop.login1
  - --filesystem=xdg-download
  - --filesystem=xdg-documents
  - --env=ELECTRON_OZONE_PLATFORM_HINT=auto

modules:
  - name: claude-desktop
    buildsystem: simple
    build-commands:
      - ar x claude-desktop_amd64.deb
      - tar -xf data.tar.xz
      - mkdir -p /app/claude-desktop
      - cp -a usr/lib/claude-desktop/. /app/claude-desktop/
      - install -Dm755 claude-desktop.sh /app/bin/claude-desktop
      - |
        for s in 16 32 48 128 256; do
          install -Dm644 "usr/share/icons/hicolor/${s}x${s}/apps/claude-desktop.png" \
            "/app/share/icons/hicolor/${s}x${s}/apps/com.anthropic.Claude.png"
        done
      - install -Dm644 usr/share/applications/com.anthropic.Claude.desktop 
          /app/share/applications/com.anthropic.Claude.desktop
      - sed -i 's/^Icon=claude-desktop$/Icon=com.anthropic.Claude/'
          /app/share/applications/com.anthropic.Claude.desktop
      - install -Dm644 com.anthropic.Claude.metainfo.xml
          /app/share/metainfo/com.anthropic.Claude.metainfo.xml

    sources:
      - type: file
        path: claude-desktop_amd64.deb
      - type: file
        path: claude-desktop.sh
      - type: file
        path: com.anthropic.Claude.metainfo.xml
